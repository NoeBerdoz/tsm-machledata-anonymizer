tracking:
  experiments:
    laptop: tsm-team
    training: tsm-training
    gate: tsm-gates
    gate_proof: tsm-gates-proof

# The teacher v1 (#46). pii_anonymizer.cloud_training runs one Agent Platform job with the
# shared values and those of one mode. Agent Platform stops the job after max_hours.
training:
  seed: 1
  data: data/train/teacher-v1.jsonl.dvc
  base_model: fastino/gliner2-privacy-filter-PII-multi
  model_revision: 1cb4166094dc58fa8d836429f060d6c95f62b495
  epochs: 2
  batch_size: 8
  modes:
    # `dvc repro` in GitHub Actions: a pipeline check that fits in the 90-minute runner.
    ci:
      max_hours: 0.5
      rows: 1000
      holdout_rows: 100
    # --trial: the short run that measures the speed before the full run.
    trial:
      max_hours: 0.34
      rows: 2000
      holdout_rows: 200
    # --full: the teacher, on every row of the subset (rows null).
    full:
      max_hours: 4
      rows: null
      holdout_rows: 0

quality_gate:
  # TODO: Record the frozen t2-dev.jsonl SHA-256 (NoeBerdoz/tsm-machledata-anonymizer#60).
  t2_dev_sha256: null
  release:
    min_teacher_recall_ratio: "95/100"
    # TODO: Fill in the GLiNER2-PII ratios from T2-dev (NoeBerdoz/tsm-machledata-anonymizer#56).
    # Use "n_protected/n_entities" and "correct_chars/predicted_chars".
    min_published_recall: null
    min_char_precision: null
    min_swiss_recall: "99/100"
    teacher_size_bytes: 1244444426
    max_size_ratio: "1/8"
    max_p95_ratio: "2/3"
  demonstration:
    # TODO: Freeze the recall threshold (NoeBerdoz/tsm-machledata-anonymizer#67).
    min_recall: null
