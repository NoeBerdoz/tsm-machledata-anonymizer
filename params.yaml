tracking:
  experiments:
    laptop: tsm-team
    training: tsm-training
    gate: tsm-gates
    gate_proof: tsm-gates-proof

training:
  max_hours: 0.5
  seed: 42
  dataset: ai4privacy/pii-masking-openpii-1m
  dataset_revision: ecfdc547f4a0955600cfe6ab98ba2a162207fcc0
  base_model: fastino/gliner2-privacy-filter-PII-multi
  model_revision: 1cb4166094dc58fa8d836429f060d6c95f62b495
  rows: 1000
  holdout_rows: 100
  epochs: 2
  batch_size: 8

# The teacher v1 (#46), launched from a laptop with pii_anonymizer.teacher_job.
teacher:
  # Agent Platform stops the job after this many hours.
  max_hours: 4
  seed: 1
  data: data/train/teacher-v1.jsonl.dvc
  # Set to the DVC MD5 of the corpus after validation against the frozen T2 split.
  reference_data_md5: null
  base_model: fastino/gliner2-privacy-filter-PII-multi
  model_revision: 1cb4166094dc58fa8d836429f060d6c95f62b495
  epochs: 2
  batch_size: 8
  # null trains on every row of the subset.
  rows: null
  holdout_rows: 0
  # The short run that measures the speed before the full run (--trial).
  trial:
    max_hours: 0.34
    data: data/train/teacher-v1-candidate.jsonl.dvc
    rows: 2000
    holdout_rows: 200

quality_gate:
  # TODO: Record the frozen t2-dev.jsonl SHA-256 (NoeBerdoz/tsm-machledata-anonymizer#60).
  t2_dev_sha256: null
  release:
    min_teacher_recall_ratio: "95/100"
    # TODO: Fill in the GLiNER2-PII ratios from T2-dev (NoeBerdoz/tsm-machledata-anonymizer#56).
    # Use "n_protected/n_entities" and "correct_chars/predicted_chars".
    min_published_recall: null
    min_char_precision: null
    min_swiss_recall: "99/100"
    teacher_size_bytes: 1244444426
    max_size_ratio: "1/8"
    max_p95_ratio: "2/3"
  demonstration:
    # TODO: Freeze the recall threshold (NoeBerdoz/tsm-machledata-anonymizer#67).
    min_recall: null
