# Agent Platform JobSpec of the teacher v1 (#46). teacher_job.py supplies args, identity
# and timeout. Same machine, image and libraries as scripts/cloud-smoke/job.yaml.
workerPoolSpecs:
  - machineSpec:
      machineType: n1-standard-4
      acceleratorType: NVIDIA_TESLA_T4
      acceleratorCount: 1
    replicaCount: 1
    containerSpec:
      imageUri: europe-docker.pkg.dev/vertex-ai/training/pytorch-gpu.2-4.py310@sha256:db53e742b58d126fae7ca6fdb62997d71acdb1e0d13df5e267fa633f9c2fc40f
      command:
        - bash
        - -c
        - |
          set -euo pipefail
          umask 077
          inputs=${1:?Pass the input directory}
          outputs=${2:?Pass the output directory}
          revision=${3:?Pass the Git SHA}
          export MLFLOW_TRACKING_URI="${4:?Pass the tracking URI}"
          mode=${5:?Pass trial or full}
          export MLFLOW_TRACKING_USERNAME=training
          export MLFLOW_SUPPRESS_PRINTING_URL_TO_STDOUT=true
          export HF_HUB_DISABLE_TELEMETRY=1
          work=$(mktemp -d)
          cp "$inputs"/{train.py,tracking.py,teacher_labels.py,params.yaml,teacher-v1.jsonl,teacher-v1.jsonl.dvc} "$work/"
          curl -fsSL https://astral.sh/uv/0.13.9/install.sh | UV_UNMANAGED_INSTALL="$work/bin" sh
          export UV_PYTHON_INSTALL_DIR="$work/python"
          export UV_CACHE_DIR="$work/cache"
          "$work/bin/uv" venv --python 3.11.18 --seed "$work/venv"
          python="$work/venv/bin/python"
          "$python" -m pip install --quiet torch==2.6.0 torchvision==0.21.0 torchaudio==2.6.0 \
            --index-url https://download.pytorch.org/whl/cu124
          "$python" -m pip install --quiet 'torch==2.6.0' 'gliner2[train]==2.1.0' 'datasets==5.1.0' \
            'transformers==5.22.2' 'peft==0.21.2' 'huggingface-hub==2.4.0' \
            'mlflow-skinny==3.18.0' 'PyYAML==6.0.3' 'google-cloud-secret-manager==2.26.0'
          cd "$work"
          "$python" train.py params.yaml "$revision" "$outputs" "$mode"
        - teacher
