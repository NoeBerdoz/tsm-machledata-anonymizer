<svg xmlns="http://www.w3.org/2000/svg" width="760" height="930" viewBox="0 0 760 930" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker>
    <style>
      .h { font-size: 16px; font-weight: 700; fill: #111827; }
      .h2 { font-size: 13.5px; font-weight: 700; fill: #111827; }
      .p { font-size: 12.5px; fill: #4B5563; }
      .z { font-size: 11px; font-weight: 700; letter-spacing: 1px; fill: #6B7280; }
      .mono { font-family: "Courier New", Courier, monospace; font-size: 12.5px; fill: #2E7D32; }
      .box { fill: #FFFFFF; stroke: #C9CED6; stroke-width: 1.3; }
      .zone { fill: #F6F7F9; stroke: #D5D9E0; stroke-width: 1.3; }
      .ar { stroke: #6B7280; stroke-width: 1.8; }
    </style>
  </defs>
  <rect width="760" height="930" fill="#FFFFFF"/>
  <text x="20" y="38" font-size="20" font-weight="700" fill="#111827">Main application architecture</text>

  <!-- Zone privée -->
  <rect x="20" y="62" width="720" height="436" rx="14" class="zone"/>
  <text x="40" y="86" class="z">ON THE USER'S DEVICE · PRIVATE ZONE</text>

  <rect x="60" y="102" width="640" height="68" rx="10" class="box"/>
  <text x="380" y="130" text-anchor="middle" class="h">User interface</text>
  <text x="380" y="152" text-anchor="middle" class="p">Prompt + files (PDF, TXT, DOCX, CSV)</text>
  <line x1="380" y1="170" x2="380" y2="198" class="ar" marker-end="url(#a)"/>

  <rect x="60" y="200" width="640" height="196" rx="10" class="box"/>
  <text x="380" y="228" text-anchor="middle" class="h">Local anonymization engine</text>
  <rect x="80" y="244" width="290" height="62" rx="8" fill="#F9FAFB" stroke="#E1E4E9"/>
  <text x="225" y="268" text-anchor="middle" class="h2">Regex</text>
  <text x="225" y="289" text-anchor="middle" class="p">Structured identifiers</text>
  <rect x="390" y="244" width="290" height="62" rx="8" fill="#F9FAFB" stroke="#E1E4E9"/>
  <text x="535" y="268" text-anchor="middle" class="h2">ML model</text>
  <text x="535" y="289" text-anchor="middle" class="p">Contextual entities</text>
  <line x1="80" y1="322" x2="680" y2="322" stroke="#E5E7EB"/>
  <text x="380" y="346" text-anchor="middle" class="h2">Replacement with placeholders</text>
  <text x="380" y="366" text-anchor="middle" class="mono">&lt;PERSON_1&gt;, &lt;IBAN_1&gt;</text>
  <text x="380" y="384" text-anchor="middle" class="p">+ local storage of the mappings</text>
  <line x1="380" y1="396" x2="380" y2="420" class="ar" marker-end="url(#a)"/>

  <rect x="60" y="422" width="640" height="58" rx="10" fill="#EAF6EE" stroke="#3C9A5F" stroke-width="1.5"/>
  <text x="380" y="447" text-anchor="middle" class="h2" fill="#1E6B3E">Anonymized content only</text>
  <text x="380" y="467" text-anchor="middle" class="p">Privacy boundary</text>

  <line x1="380" y1="480" x2="380" y2="518" class="ar" marker-end="url(#a)"/>

  <!-- Cloud -->
  <rect x="20" y="520" width="720" height="236" rx="14" class="zone"/>
  <text x="40" y="544" class="z">CLOUD · COMMUNICATION WITH OPENAI</text>

  <rect x="60" y="558" width="640" height="60" rx="10" class="box"/>
  <text x="380" y="583" text-anchor="middle" class="h">Backend API (FastAPI)</text>
  <text x="380" y="604" text-anchor="middle" class="p">Authentication and request control</text>
  <line x1="370" y1="620" x2="370" y2="646" class="ar" marker-end="url(#a)"/>
  <line x1="390" y1="646" x2="390" y2="620" class="ar" marker-end="url(#a)"/>

  <rect x="60" y="648" width="640" height="68" rx="10" class="box"/>
  <text x="380" y="676" text-anchor="middle" class="h">OpenAI Responses API</text>
  <text x="380" y="698" text-anchor="middle" class="p">Processes the anonymized prompt</text>

  <line x1="380" y1="756" x2="380" y2="800" class="ar" marker-end="url(#a)"/>
  <text x="392" y="783" class="p" font-style="italic">response (placeholders only)</text>

  <!-- Retour zone privée -->
  <rect x="20" y="804" width="720" height="108" rx="14" class="zone"/>
  <text x="40" y="828" class="z">BACK ON THE DEVICE · PRIVATE ZONE</text>
  <rect x="60" y="836" width="640" height="62" rx="10" class="box"/>
  <text x="380" y="862" text-anchor="middle" class="h">Response restored locally</text>
  <text x="380" y="884" text-anchor="middle" class="p">Placeholders replaced by the real values, then displayed</text>
</svg>
