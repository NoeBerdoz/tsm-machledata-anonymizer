<svg xmlns="http://www.w3.org/2000/svg" width="850" height="990" viewBox="0 0 850 990" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker>
    <marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#E0A040"/></marker>
    <style>
      .h { font-size: 16px; font-weight: 700; fill: #111827; }
      .h2 { font-size: 13.5px; font-weight: 700; fill: #111827; }
      .p { font-size: 12.5px; fill: #4B5563; }
      .z { font-size: 11px; font-weight: 700; letter-spacing: 1px; fill: #6B7280; }
      .box { fill: #FFFFFF; stroke: #C9CED6; stroke-width: 1.3; }
      .zone { fill: #F6F7F9; stroke: #D5D9E0; stroke-width: 1.3; }
      .ar { stroke: #6B7280; stroke-width: 1.8; fill: none; }
    </style>
  </defs>
  <rect width="850" height="990" fill="#FFFFFF"/>
  <text x="20" y="38" font-size="20" font-weight="700" fill="#111827">Training and deployment pipeline</text>

  <rect x="60" y="62" width="640" height="68" rx="10" class="box"/>
  <text x="380" y="90" text-anchor="middle" class="h">GitHub</text>
  <text x="380" y="112" text-anchor="middle" class="p">Code and configuration</text>
  <line x1="380" y1="130" x2="380" y2="158" class="ar" marker-end="url(#a)"/>

  <rect x="60" y="160" width="640" height="68" rx="10" class="box"/>
  <text x="380" y="188" text-anchor="middle" class="h">GitHub Actions</text>
  <text x="380" y="210" text-anchor="middle" class="p">Automated tests and pipeline trigger</text>
  <line x1="380" y1="228" x2="380" y2="256" class="ar" marker-end="url(#a)"/>

  <rect x="20" y="258" width="720" height="384" rx="14" class="zone"/>
  <text x="40" y="282" class="z">GOOGLE CLOUD · AGENT PLATFORM</text>

  <rect x="60" y="296" width="640" height="52" rx="9" class="box"/>
  <text x="380" y="317" text-anchor="middle" class="h2">1. Data preparation</text>
  <text x="380" y="336" text-anchor="middle" class="p">Datasets, cleaning, splits</text>
  <line x1="380" y1="348" x2="380" y2="362" class="ar" marker-end="url(#a)"/>

  <rect x="60" y="364" width="640" height="52" rx="9" class="box"/>
  <text x="380" y="385" text-anchor="middle" class="h2">2. Teacher fine-tuning</text>
  <text x="380" y="404" text-anchor="middle" class="p">Large PII detection model</text>
  <line x1="380" y1="416" x2="380" y2="430" class="ar" marker-end="url(#a)"/>

  <rect x="60" y="432" width="640" height="52" rx="9" class="box"/>
  <text x="380" y="453" text-anchor="middle" class="h2">3. Distillation</text>
  <text x="380" y="472" text-anchor="middle" class="p">Teacher → student</text>
  <line x1="380" y1="484" x2="380" y2="498" class="ar" marker-end="url(#a)"/>

  <rect x="60" y="500" width="640" height="52" rx="9" class="box"/>
  <text x="380" y="521" text-anchor="middle" class="h2">4. Quantization</text>
  <text x="380" y="540" text-anchor="middle" class="p">Makes the student smaller</text>
  <line x1="380" y1="552" x2="380" y2="566" class="ar" marker-end="url(#a)"/>

  <rect x="60" y="568" width="640" height="52" rx="9" class="box"/>
  <text x="380" y="589" text-anchor="middle" class="h2">5. Evaluation and quality gates</text>
  <text x="380" y="608" text-anchor="middle" class="p">Detection quality and performance</text>

  <path d="M380,642 L380,660 M205,660 L555,660" class="ar"/>
  <line x1="205" y1="660" x2="205" y2="686" class="ar" marker-end="url(#a)"/>
  <line x1="555" y1="660" x2="555" y2="686" class="ar" marker-end="url(#a)"/>

  <rect x="40" y="688" width="330" height="68" rx="10" fill="#EAF6EE" stroke="#3C9A5F" stroke-width="1.5"/>
  <text x="205" y="716" text-anchor="middle" class="h" fill="#1E6B3E">PASS</text>
  <text x="205" y="738" text-anchor="middle" class="p">Model published to the model registry</text>

  <rect x="390" y="688" width="330" height="68" rx="10" fill="#FDEEEE" stroke="#C94A4A" stroke-width="1.5"/>
  <text x="555" y="716" text-anchor="middle" class="h" fill="#9B2C2C">FAIL</text>
  <text x="555" y="738" text-anchor="middle" class="p">Model rejected</text>

  <path d="M205,756 L205,772 L380,772 L380,790" class="ar" marker-end="url(#a)"/>

  <rect x="60" y="792" width="640" height="68" rx="10" class="box"/>
  <text x="380" y="820" text-anchor="middle" class="h">Local application</text>
  <text x="380" y="842" text-anchor="middle" class="p">Downloads and installs the approved model</text>
  <line x1="380" y1="860" x2="380" y2="888" class="ar" marker-end="url(#a)"/>

  <rect x="60" y="890" width="640" height="76" rx="10" fill="#FFF7EB" stroke="#E0A040" stroke-width="1.5"/>
  <text x="380" y="918" text-anchor="middle" class="h">Monitoring (e.g. Sentry)</text>
  <text x="380" y="940" text-anchor="middle" class="p">Response times, errors, user feedback</text>
  <text x="380" y="957" text-anchor="middle" class="p">No personal data is collected</text>

  <path d="M700,928 L790,928 L790,96 L702,96" fill="none" stroke="#E0A040" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#o)"/>
  <rect x="746" y="470" width="88" height="46" rx="8" fill="#FFF7EB" stroke="#E0A040" stroke-width="1.2"/>
  <text x="790" y="489" text-anchor="middle" font-size="11" font-weight="700" fill="#9A5B00">feedback</text>
  <text x="790" y="505" text-anchor="middle" font-size="11" fill="#9A5B00">next iteration</text>
</svg>
