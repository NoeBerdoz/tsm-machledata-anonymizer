name: Train and evaluate
run-name: Train and evaluate (${{ inputs.synthetic_proof && 'synthetic proof' || 'T2-dev' }})

on:
  workflow_dispatch:
    inputs:
      synthetic_proof:
        description: Use the synthetic fixture and proof-only MLflow login
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - '.github/workflows/training.yml'
      - '.dvc/config'
      - 'dvc.yaml'
      - 'params.yaml'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'data/**/*.dvc'
      - 'scripts/training/**'
      - 'src/pii_anonymizer/cloud_training.py'
      - 'src/pii_anonymizer/teacher_labels.py'
      - 'src/pii_anonymizer/training_pipeline.py'
      - 'src/pii_anonymizer/tracking.py'
      - 'src/pii_anonymizer/gate.py'
      - 'src/pii_anonymizer/evaluate.py'
      - 'src/pii_anonymizer/baselines.py'
      - 'src/pii_anonymizer/benchmark.py'
      - 'src/pii_anonymizer/metrics.py'
      - 'src/pii_anonymizer/results.py'
      - 'src/pii_anonymizer/spans.py'

permissions:
  contents: read

concurrency:
  group: training-gpu
  cancel-in-progress: false

jobs:
  train-and-evaluate:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || vars.TRAINING_ON_PUSH == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: training-gate
    permissions:
      contents: read
      id-token: write
    env:
      PROOF_MODE: ${{ inputs.synthetic_proof && '--proof' || '' }}
      MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
      MLFLOW_SUPPRESS_PRINTING_URL_TO_STDOUT: 'true'
    steps:
      - name: Record runner start time
        run: printf 'TRAINING_RUNNER_STARTED_AT=%s\n' "$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - run: uv sync --locked --group gliner2-tests
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: tsmmachledata-projet
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.WIF_SERVICE_ACCOUNT }}
      - name: Prepare the dataset
        run: uv run --locked --no-sync python -m pii_anonymizer.training_pipeline prepare $PROOF_MODE
      - name: Reproduce train, evaluate and gate
        id: repro
        env:
          MLFLOW_TRACKING_USERNAME: ${{ inputs.synthetic_proof && 'actions-proof' || 'actions' }}
          MLFLOW_TRACKING_PASSWORD: ${{ secrets[inputs.synthetic_proof && 'MLFLOW_PROOF_PASSWORD' || 'MLFLOW_GATE_PASSWORD'] }}
        run: |
          test -n "$MLFLOW_TRACKING_URI" && test -n "$MLFLOW_TRACKING_PASSWORD" ||
            { echo "Configure the MLflow credentials for this run."; exit 1; }
          uv run --locked --no-sync dvc repro --pull
      - name: Save reusable DVC stages
        if: ${{ !cancelled() && steps.repro.outcome != 'skipped' }}
        run: uv run --locked --no-sync python -m pii_anonymizer.training_pipeline push-cache
      - name: Summarize the run
        if: ${{ always() }}
        run: |
          if [[ -x .venv/bin/python ]]; then
            .venv/bin/python -m pii_anonymizer.training_pipeline summary $PROOF_MODE
          else
            printf '## Training quality gate\n\n**Gate result:** NOT RUN\n' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Save pipeline evidence
        if: ${{ !cancelled() && steps.repro.outcome != 'skipped' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: training-evidence
          include-hidden-files: true
          path: |
            dvc.lock
            .pipeline/training.json
            .pipeline/training-status.txt
            .pipeline/evaluation/
            .pipeline/gate.json
      - name: Require a passing gate
        if: ${{ steps.repro.outcome == 'success' }}
        run: uv run --locked --no-sync python -m pii_anonymizer.training_pipeline verdict
